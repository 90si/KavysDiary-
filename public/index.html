<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavya's Diary - Roleplay Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1f1f1f; padding: 15px; text-align: center; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 15px; line-height: 1.4; }
        .user { align-self: flex-end; background: #2563eb; color: #fff; }
        .bot { align-self: flex-start; background: #27272a; border: 1px solid #3f3f46; color: #e4e4e7; }
        .input-area { padding: 12px; background: #1f1f1f; display: flex; gap: 8px; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; outline: none; }
        button { padding: 12px 18px; background: #ec4899; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .reset-btn { background: #ef4444; font-size: 12px; padding: 6px 10px; }
    </style>
</head>
<body>

    <header>
        <h3>💖 Kavya's Diary</h3>
        <button class="reset-btn" onclick="resetGame()">Reset Chat</button>
    </header>

    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMsg()">Send</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        // LocalStorage se history load karo (Auto-Save system)
        let history = JSON.parse(localStorage.getItem('kavya_chat_history')) || [];

        // Page khulne par purani chat screen par dikhao
        window.onload = () => {
            if (history.length === 0) {
                appendMessage("bot", "*Subah ki dhoop haveli ke aangan mein phail chuki hai. Sangeet ki practice ka shor shuru ho gaya hai.*\n\nKavya beech aangan mein khadi hokar tumhe dekh rahi hai...");
            } else {
                history.forEach(item => {
                    appendMessage(item.role === 'user' ? 'user' : 'bot', item.content);
                });
            }
        };

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMsg() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';

            // Send to Server
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: history })
                });

                const data = await res.json();
                const reply = data.reply || "Kuch error aaya!";

                appendMessage('bot', reply);

                // Update LocalStorage History (Auto-Save)
                history.push({ role: 'user', content: text });
                history.push({ role: 'assistant', content: reply });
                localStorage.setItem('kavya_chat_history', JSON.stringify(history));

            } catch (err) {
                appendMessage('bot', "Server Error, please try again.");
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMsg();
        }

        function resetGame() {
            if (confirm("Kya aap poori chat reset karke game shuru se chalu karna chahte ho?")) {
                localStorage.removeItem('kavya_chat_history');
                location.reload();
            }
        }
    </script>
</body>
</html>
