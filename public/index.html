<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saali Aadhi Gharwali - Roleplay</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #121214; color: #e1e1e6; display: flex; flex-direction: column; height: 100vh; }
        .header { display: flex; align-items: center; padding: 12px 16px; background: #1a1a1e; border-bottom: 1px solid #29292e; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #e91e63; }
        .character-name { font-weight: bold; font-size: 16px; color: #ffffff; }
        .roleplay-tag { font-size: 12px; color: #8d8d99; }
        .status-bar { background: #1e1e24; padding: 10px 16px; font-size: 13px; color: #c4c4cc; border-bottom: 1px solid #29292e; }
        .chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
        .msg-box { max-width: 88%; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
        .user-msg { align-self: flex-end; background: #29292e; color: #e1e1e6; }
        .ai-msg { align-self: flex-start; background: #1e1e24; color: #c4c4cc; border: 1px solid #29292e; }
        .input-area { padding: 12px; background: #1a1a1e; border-top: 1px solid #29292e; display: flex; gap: 8px; }
        .input-field { flex: 1; background: #202024; border: 1px solid #29292e; padding: 12px 16px; border-radius: 24px; color: #ffffff; outline: none; }
        .send-btn { background: #e91e63; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <div class="avatar"></div>
        <div>
            <div class="character-name">Saali Aadhi Gharwali</div>
            <div class="roleplay-tag">Roleplay</div>
        </div>
    </div>
    <div class="status-bar">
        ❤️ Pyaar: 20/100 | Rasmon Ki Izzat: 40/100<br>📅 Shaadi: Din 3/7 — Sangeet
    </div>
    <div class="chat-container" id="chatBox">
        <div class="msg-box ai-msg">
            *Subah ki dhoop haveli ke aangan mein phail chuki hai. Sangeet ki practice ka shor shuru ho gaya hai.*<br><br>Kavya beech aangan mein khadi hokar tumhe dekh rahi hai...
        </div>
    </div>
    <div class="input-area">
        <input type="text" class="input-field" id="userInput" placeholder="Type your message...">
        <button class="send-btn" onclick="sendMessage()">➔</button>
    </div>
    <script>
        let history = [];
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            appendMsg(text, 'user-msg');
            input.value = '';
            
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, history: history })
            });
            const data = await res.json();
            appendMsg(data.reply, 'ai-msg');
            history.push({ role: 'user', content: text });
            history.push({ role: 'assistant', content: data.reply });
        }
        function appendMsg(text, className) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg-box ${className}`;
            div.innerHTML = text.replace(/\*(.*?)\*/g, '<i>*$1*</i>');
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
